[project]
name = "mcp-dattormm"
version = "0.1.0"
description = "MCP server for Datto RMM API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.12.0",
    "cryptography>=48.0.1",
    "python-multipart>=0.0.22",
]

[project.scripts]
mcp-dattormm = "mcp_dattormm.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
